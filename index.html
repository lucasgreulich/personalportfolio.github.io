<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Lucas Greulich</title>
</head>
<body>
    <header class="navbar">
        <a href="./index.html">Home</a>
        <a href="./portfolio.html">Portfolio</a>
        <a href="./contact.html">Contact</a>
        <label class="switch">
            <input type="checkbox" id="mode-toggle">
            <span class="slider"></span>
        </label>
    </header>
    
    <main class="container">
        <img src="pictures/lucas-plane.JPG" alt="Lucas Greulich">
        <h1>Welcome to My Photography Portfolio</h1>
        <p>Hi, I'm Lucas — a photographer capturing stories through light, motion, and mood.</p>
        <p>Explore my latest shoots and collections in the <a href="portfolio.html">portfolio</a>.</p>
        <p>New work is added regularly, so check back soon for updates.</p>
    </main>
    <footer class="footer">
    </footer>
    <script>
      (function(){
        const toggle = document.getElementById('mode-toggle');
        function setMode(mode){
          document.body.classList.remove('day','night');
          document.body.classList.add(mode);
          localStorage.setItem('mode', mode);
          if(toggle) toggle.checked = mode === 'night';
        }
        if(toggle){
          toggle.addEventListener('change', () => {
            const newMode = toggle.checked ? 'night' : 'day';
            setMode(newMode);
          });
        }
        /* debug: log nav clicks */
        document.querySelectorAll('.navbar a').forEach(a => {
          a.addEventListener('click', e => console.log('nav click', a.getAttribute('href')));
        });
        const stored = localStorage.getItem('mode');
        if(stored === 'night' || stored === 'day'){
          setMode(stored);
        } else {
          setMode('night');
        }
      })();
    </script>
</html>
